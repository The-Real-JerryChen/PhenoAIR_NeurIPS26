[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phenoair"
version = "0.1.0"
description = "Multi-agent mechanism-of-action inference over Cell Painting and structure evidence"
readme = "README.md"
authors = [
  {name = "Jiayuan Chen"},
  {name = "Botao Yu"},
  {name = "Tianyu Liu"},
  {name = "Thai-Hoang Pham"},
  {name = "Meng Wu"},
  {name = "Ping Zhang"},
]
requires-python = ">=3.10"
dependencies = [
  "litellm>=1.60",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14",
  "rdkit>=2023.9",
  "tqdm>=4.66",
]

[project.scripts]
phenoair = "phenoair.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["phenoair*"]

[tool.setuptools.package-data]
phenoair = ["resources/**/*.json"]
